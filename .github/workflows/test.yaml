name: Test

on:
- push

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        os:
        - Ubuntu
        python-version:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        include:
        - os: Ubuntu
          image: ubuntu-latest
        - os: Windows
          image: windows-latest
          python-version: "3.9"
        - os: Windows
          image: windows-latest
          python-version: "3.13"
        - os: macOS
          image: macos-latest
          python-version: "3.9"
        - os: macOS
          image: macos-latest
          python-version: "3.13"
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Check lock file
        run: uv lock --locked

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest
